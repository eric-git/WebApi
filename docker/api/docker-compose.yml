name: webapi-suite

services:

  api:
    labels:
      app: api
      tier: backend
      role: protected-api
      purpose: serve-application-data
      managed-by: compose
      lifecycle: persistent
    build:
      context: ../src
      dockerfile: ../docker/Dockerfile
      target: api-runtime
    image: webapi-suite/api:latest
    pull_policy: never
    ports:
      - "5002:443"
    environment:
      SSL_CERT_FILE: /run/secrets/ca-bundle
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: https://+:443
      ASPNETCORE_Kestrel__Certificates__Default__Path: /run/secrets/hosting-cert.crt
      ASPNETCORE_Kestrel__Certificates__Default__KeyPath: /run/secrets/hosting-key.pem
      ISSUER_BASE_URL: https://issuer.webapisuite.projecteric.io/connect
      API_ID: af2157c0-3280-42e7-b327-33e5aa3ec76e
      SECRET_PATH: /run/secrets/
      Logging__LogLevel__Default: Warning
      Logging__LogLevel__WebApi: Information
      Logging__Console__FormatterName: simple
      Logging__Console__FormatterOptions__IncludeTimestamp: true
      Logging__Console__FormatterOptions__TimestampFormat: 'yyyy-MM-dd HH:mm:ss.fff '
    secrets:
      - source: issuer-hosting-cert
        target: issuer-hosting-cert.crt
      - source: api-hosting-cert
        target: hosting-cert.crt
      - source: api-hosting-key
        target: hosting-key.pem
      - ca-bundle
    networks:
      public:
        ipv4_address: 172.20.0.11
    extra_hosts:
      - "issuer.webapisuite.projecteric.io:172.20.0.10"
      - "api.webapisuite.projecteric.io:172.20.0.11"
    restart: always

secrets:

  api-hosting-cert:
    labels:
      app: api
      role: certs
      purpose: trust-material
      managed-by: compose
      lifecycle: persistent
    file: ../local/hosting/api-cert.crt

  api-hosting-key:
    labels:
      app: api
      role: keys
      purpose: private-material
      managed-by: compose
      lifecycle: persistent
    file: ../local/hosting/api-key.pem
