name: webapi-suite

services:

  issuer:
    labels:
      app: issuer
      tier: backend
      role: identity-provider
      purpose: authentication-and-authorization
      managed-by: compose
      lifecycle: persistent
    build:
      context: ../src
      dockerfile: ../docker/Dockerfile
      target: issuer-runtime
    image: webapi-suite/issuer:latest
    hostname: issuer.webapisuite.projecteric.io
    pull_policy: never
    ports:
      - "5001:443"
    environment:
      SSL_CERT_FILE: /run/secrets/ca-bundle
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80;https://+:443
      ASPNETCORE_Kestrel__Certificates__Default__Path: /run/secrets/hosting-cert.crt
      ASPNETCORE_Kestrel__Certificates__Default__KeyPath: /run/secrets/hosting-key.pem
      TOKEN_LIFETIME_MINUTES: 30
      SECRET_PATH: /run/secrets/
      Logging__LogLevel__Default: Warning
      Logging__LogLevel__WebApi: Information
      Logging__Console__FormatterName: simple
      Logging__Console__FormatterOptions__IncludeTimestamp: true
      Logging__Console__FormatterOptions__TimestampFormat: 'yyyy-MM-dd HH:mm:ss.fff '
    secrets:
      - source: issuer-hosting-cert
        target: hosting-cert.crt
      - source: issuer-hosting-key
        target: hosting-key.pem
      - source: issuer-public-signing-key
        target: public-signing-key.pem
      - source: issuer-private-signing-key
        target: private-signing-key.pem
      - ca-bundle
    networks:
      - public
    restart: always

secrets:

  issuer-hosting-cert:
    labels:
      app: issuer
      role: certs
      purpose: trust-material
      managed-by: compose
      lifecycle: persistent
    file: ../local/hosting/issuer-cert.crt

  issuer-hosting-key:
    labels:
      app: issuer
      role: keys
      purpose: private-material
      managed-by: compose
      lifecycle: persistent
    file: ../local/hosting/issuer-key.pem

  issuer-public-signing-key:
    labels:
      app: issuer
      role: keys
      purpose: private-material
      managed-by: compose
      lifecycle: persistent
    file: ../local/signing/issuer-public.pem

  issuer-private-signing-key:
    labels:
      app: issuer
      role: keys
      purpose: private-material
      managed-by: compose
      lifecycle: persistent
    file: ../local/signing/issuer-private.pem
