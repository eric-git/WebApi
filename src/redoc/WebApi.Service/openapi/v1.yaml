                type: https://webapisuite.projecteric.io/error/403
                title: Forbidden
                status: 403
                detail: You do not have permission to access this resource.
                instance: games/
                traceId: 0HNIV5A3KTS4L:00000003
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
