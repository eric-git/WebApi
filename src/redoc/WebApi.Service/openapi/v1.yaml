              example:
                - Id: cbeaf0cd-f2bd-4b95-9e73-9851c41723b8
                  Type: game
                  Name: Mario Kart 8 Deluxe
                  PlayerName: Mario
                  PlayerHealth: 100
      security:
        - Bearer: [ ]
    post:
